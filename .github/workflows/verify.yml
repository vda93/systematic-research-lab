name: Verify research portfolio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up public Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the complete pinned runtime and developer toolchain
        run: >-
          python -m pip --isolated install --index-url https://pypi.org/simple --only-binary=:all: --no-deps -r requirements-lock.txt
      - name: Build and install the project without resolving new dependencies
        run: python -m pip --isolated install --no-deps --no-build-isolation .
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check Python syntax and correctness lint across all public code
        run: python -m ruff check src scripts tests
      - name: Type-check the evidence, claim and empirical modules
        run: python -m mypy
      - name: Run all tests and reproduce checked artifacts with branch coverage
        run: python -m coverage run scripts/reproduce.py --check
      - name: Enforce the measured library coverage regression gate
        run: python -m coverage report
      - name: Verify depublication against historical Git paths
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -c "from pathlib import Path; from scripts.audit_public import audit_git; audit = audit_git(Path('.')); print(audit); assert audit['status'] == 'PASS'"
      - name: Audit every pinned runtime and developer package
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements-lock.txt
      - name: Capture the website before and after this PR
        id: review_images
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- 'docs/*.html' docs/site.css docs/plots; then
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/site-review"
          for version in before after; do
            revision="$BASE_SHA"
            if [[ "$version" == after ]]; then revision="$HEAD_SHA"; fi
            snapshot="$RUNNER_TEMP/site-$version"
            mkdir -p "$snapshot"
            git archive "$revision" docs | tar -x -C "$snapshot"
            for page in index orbindex macroimpulse; do
              test -s "$snapshot/docs/$page.html"
              for viewport in 1440,1000 390,844; do
                google-chrome --headless --disable-gpu --disable-dev-shm-usage \
                  --no-first-run --hide-scrollbars \
                  --user-data-dir="$RUNNER_TEMP/review-chrome" --window-size="$viewport" \
                  --screenshot="$RUNNER_TEMP/site-review/$version-$page-${viewport%,*}.png" \
                  "file://$snapshot/docs/$page.html"
              done
            done
          done
          echo "captured=true" >> "$GITHUB_OUTPUT"
      - name: Attach before and after screenshots to the review run
        if: steps.review_images.outputs.captured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-before-and-after
          path: ${{ runner.temp }}/site-review/*.png
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete public history without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and run the MIT-licensed Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
