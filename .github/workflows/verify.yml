name: Verify synthetic research

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up public Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the original package from public dependencies
        run: python -m pip --isolated install --no-deps --index-url https://pypi.org/simple .
      - name: Run all tests and reproduce checked artifacts
        run: python scripts/reproduce.py --check
