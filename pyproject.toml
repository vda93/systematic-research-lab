[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-research-lab"
version = "1.0.0"
description = "Original synthetic experiments in concentration, dependent-data inference and research correctness"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "vda93"}]
dependencies = []

[project.urls]
Repository = "https://github.com/vda93/systematic-research-lab"

[tool.setuptools.packages.find]
where = ["src"]
