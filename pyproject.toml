[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "systematic-research-lab"
version = "2.1.0"
description = "TradingBotHQ empirical research: falsification, robustness, implementation parity and evidence governance"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "vda93"}]
dependencies = ["matplotlib==3.10.7", "numpy==2.5.1"]

[project.optional-dependencies]
dev = ["coverage==7.16.2", "mypy==2.4.0", "pip-audit==2.10.1", "ruff==0.17.1"]

[project.urls]
Repository = "https://github.com/vda93/systematic-research-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
cache-dir = ".pytest_cache/ruff"

[tool.ruff.lint]
select = ["F", "E9"]

[tool.mypy]
python_version = "3.12"
files = ["src/srl/evidence.py", "src/srl/fx_study.py", "src/srl/claims.py", "src/srl/block_means.py", "src/srl/bbo.py", "src/srl/bbo_acquire.py"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
cache_dir = ".pytest_cache/mypy"

[tool.coverage.run]
branch = true
source = ["srl"]
data_file = ".pytest_cache/coverage"

[tool.coverage.report]
show_missing = true
fail_under = 90
precision = 2
