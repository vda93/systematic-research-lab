 <title id="figure-title">03  |  Pending orders occupy the slot</title>
 <desc id="figure-desc">CONCEPTUAL_SCHEMATIC · Fictional order-state example
Source-defined H002 policies; no historical path Fictional A/B/C signals; orders stay unfilled. Replacement assumes active-position eligibility. Without applied break-even (BE_APPLIED), a live position blocks replacement. Neither policy expires. No historical price path or contemporaneous counterfactual sequence is shown. Separate H002 contracts; all four PARKED. Source B21. Source contract: One good-till-cancelled pending order blocks later signals; no time expiry. Check active-position eligibility first. A non-BE_APPLIED position blocks replacement. Otherwise supersede old pending and create the new signal order; no time expiry. Skipped new signals correspond to source state SKIPPED_PENDING_ORDER.</desc>
 <title>03  |  Pending orders occupy the slot</title>
