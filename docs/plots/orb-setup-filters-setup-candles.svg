<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title description">
<title id="title">Opening-range breakout: the candlestick setup</title>
<desc id="description">Synthetic fifteen-minute midpoint candles illustrate a long OR15 setup. The shaded 09:30 to 09:45 candle defines the range and closes inside it. The following candle closes above the range at 10:00. Entry uses the next eligible Ask quote, the stop is at the range low, and the target is 1.5 times entry-to-stop risk. No later outcome is shown.</desc>
<rect x="0" y="0" width="1120" height="760" rx="0" fill="#FBFCFD"/>
<text x="28" y="42" font-family="Arial,sans-serif" font-size="26" fill="#182D3A" text-anchor="start" font-weight="700">Opening-range breakout: the candlestick setup</text>
<text x="28" y="72" font-family="Arial,sans-serif" font-size="16" fill="#576A76" text-anchor="start" font-weight="400">Long example | Each candle spans 15 minutes | New York time | Synthetic prices</text>
<text x="28" y="119" font-family="Arial,sans-serif" font-size="14" fill="#576A76" text-anchor="start" font-weight="400">Illustrative price</text>
