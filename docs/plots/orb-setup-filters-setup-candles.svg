<line x1="582" y1="627" x2="620" y2="627" stroke="#8265A6" stroke-width="2" stroke-dasharray="6 5"/>
<text x="633" y="633" font-family="Arial,sans-serif" font-size="18" fill="#243444" text-anchor="start" font-weight="700">EMA200: optional later filter</text>
<text x="582" y="661" font-family="Arial,sans-serif" font-size="16" fill="#8265A6" text-anchor="start" font-weight="400">Long close above EMA; short close below it.</text>
<text x="28" y="717" font-family="Arial,sans-serif" font-size="14" fill="#526976" text-anchor="start" font-weight="400">Synthetic candles and EMA illustrate the rules. Initial price risk runs from the actual Ask entry to the range low.</text>
<text x="28" y="742" font-family="Arial,sans-serif" font-size="13" fill="#526976" text-anchor="start" font-weight="400">Long exits use Bid. Off-grid stops or targets reject entry. The target line is a level, not an observed result. Source: ORBF1.</text>
</svg>
